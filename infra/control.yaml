apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pilot-postgres, namespace: releasepilot-demo}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: releasepilot-demo}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: pilot}
            - {name: POSTGRES_DB, value: pilot}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: pilot-config, key: POSTGRES_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: [pg_isready, -U, pilot]}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: pilot-postgres}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: releasepilot-demo}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: pilot-worker, namespace: releasepilot-demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: deploy-demo, namespace: releasepilot-demo}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [demo-api]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: deploy-demo, namespace: releasepilot-demo}
subjects:
  - {kind: ServiceAccount, name: pilot-worker, namespace: releasepilot-demo}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: deploy-demo}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pilot-api, namespace: releasepilot-demo}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pilot-api}
  template:
    metadata: {labels: {app: pilot-api}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pilot
          image: releasepilot:local
          imagePullPolicy: Never
          command: [sh, -c, 'alembic upgrade head && exec uvicorn pilot.api:app --host 0.0.0.0 --port 8000']
          envFrom: [{secretRef: {name: pilot-config}}]
          env:
            - {name: PROMETHEUS_URL, value: 'http://prometheus:9090'}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pilot-worker, namespace: releasepilot-demo}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pilot-worker}
  template:
    metadata: {labels: {app: pilot-worker}}
    spec:
      serviceAccountName: pilot-worker
      containers:
        - name: pilot
          image: releasepilot:local
          imagePullPolicy: Never
          command: [python, -m, pilot.worker]
          envFrom: [{secretRef: {name: pilot-config}}]
          env:
            - {name: PROMETHEUS_URL, value: 'http://prometheus:9090'}

---
apiVersion: v1
kind: Service
metadata: {name: pilot-api, namespace: releasepilot-demo}
spec:
  selector: {app: pilot-api}
  ports: [{port: 8000}]
