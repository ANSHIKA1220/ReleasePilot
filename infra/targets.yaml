apiVersion: v1
kind: Namespace
metadata:
  name: releasepilot-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: releasepilot-demo
  labels: {app.kubernetes.io/managed-by: releasepilot}
spec:
  replicas: 2
  progressDeadlineSeconds: 90
  selector:
    matchLabels: {app: demo-api}
  template:
    metadata:
      labels: {app: demo-api}
    spec:
      containers:
        - name: api
          image: releasepilot-demo:bootstrap
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: {name: demo-api, namespace: releasepilot-demo}
spec:
  selector: {app: demo-api}
  ports: [{port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: traffic, namespace: releasepilot-demo}
spec:
  replicas: 1
  selector:
    matchLabels: {app: traffic}
  template:
    metadata:
      labels: {app: traffic}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: traffic
          image: busybox:1.36
          command: [sh, -c, 'while true; do wget -q -T 2 -O /dev/null http://demo-api:8080/work; sleep 0.1; done']
