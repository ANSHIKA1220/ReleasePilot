apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: releasepilot-demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: scrape-pods, namespace: releasepilot-demo}
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: scrape-pods, namespace: releasepilot-demo}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: releasepilot-demo}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: scrape-pods}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus, namespace: releasepilot-demo}
data:
  prometheus.yml: |
    global:
      scrape_interval: 3s
    scrape_configs:
      - job_name: releasepilot
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [releasepilot-demo]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_container_port_name], regex: http, action: keep}
          - {source_labels: [__meta_kubernetes_pod_label_releasepilot_id], regex: '.+', action: keep}
          - {source_labels: [__meta_kubernetes_namespace], target_label: namespace}
          - {source_labels: [__meta_kubernetes_pod_label_app], target_label: deployment}
          - {source_labels: [__meta_kubernetes_pod_label_releasepilot_id], target_label: release_id}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: releasepilot-demo}
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ['--config.file=/etc/prometheus/prometheus.yml','--storage.tsdb.path=/prometheus']
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes: [{name: config, configMap: {name: prometheus}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: releasepilot-demo}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
