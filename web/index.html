<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ReleasePilot · Deployment console</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header>
      <div class="brand"><b aria-hidden="true">↗</b> ReleasePilot</div>
      <span id="identity"></span>
    </header>
    <main>
      <section id="login">
        <div class="eyebrow">OPERATOR ACCESS</div>
        <h1>Release console</h1>
        <form id="loginForm">
          <label
            >Email<input
              type="email"
              name="email"
              autocomplete="username"
              required /></label
          ><label
            >Password<input
              type="password"
              name="password"
              autocomplete="current-password"
              required /></label
          ><button>Sign in</button>
        </form>
      </section>
      <section id="console" hidden>
        <nav id="nav"></nav>
        <div id="content"></div>
      </section>
      <p id="notice" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
